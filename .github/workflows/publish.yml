name: publish

# Cut a release by pushing a tag: `npm version <patch|minor|major>` then
# `git push --follow-tags`. This publishes @bounded-systems/brand to BOTH
# registries from one tag:
#   • npm — keyless trusted publishing + build provenance (OIDC)
#   • JSR — keyless publish (OIDC), shipped with the typed tokens module
# A shared `verify` gate proves package.json, deno.json, and the tag all agree
# and the generated artifacts (tokens.css + typed tokens.ts) are not stale.
on:
  push:
    tags: ["v*"]
  # A tag publishes to both registries, but the two can succeed independently —
  # v2.0.0 went out on npm and was refused by JSR, leaving the release half-done
  # with no way to finish it: re-running the tag's workflow re-runs the OLD file,
  # and a plain dispatch would retry npm for a version already published (a
  # guaranteed failure that says nothing). `registry` makes each half separately
  # recoverable without burning a version number.
  workflow_dispatch:
    inputs:
      registry:
        description: "Which registry to publish to. Use `jsr` (or `npm`) to finish a release where only one half landed."
        type: choice
        options: [both, npm, jsr]
        default: both

permissions:
  contents: read
  id-token: write # npm provenance + JSR publish (OIDC, keyless)

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # Tag (when present) must equal package.json AND deno.json, or a publish is a lie.
      - name: Versions agree (tag == package.json == deno.json)
        run: node tools/verify-versions.mjs "${{ github.ref_type == 'tag' && github.ref_name || '' }}"

      - run: npm ci
      # Drift gates: the committed generated artifacts must match a fresh build.
      - name: Token drift (tokens.css)
        run: node tokens/build-tokens.mjs --check
      - name: Build native + typed projections
        run: npm run build:sd
      - name: Typed-tokens drift (tokens.ts)
        run: node tools/build-tokens-ts.mjs --check

  npm:
    needs: verify
    # Skipped only when a dispatch explicitly asks for JSR alone; every tag push
    # still publishes both.
    if: github.event_name != 'workflow_dispatch' || inputs.registry != 'jsr'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Trusted Publishing (OIDC) requires npm CLI >=11.5.1 — pin explicitly rather
      # than trust whatever version Node 22 happens to bundle.
      - run: npm install -g npm@latest
      - run: npm ci # install devDeps (style-dictionary) so prepack's build can run
      - name: Publish to npm
        # prepack (build:css + build:ts) regenerates tokens.css + tokens.ts into the tarball.
        # No NODE_AUTH_TOKEN — npm's OIDC Trusted Publisher (configured on npmjs.com
        # for this exact repo+workflow) authenticates via the job's id-token: write.
        run: npm publish --provenance --access public

  jsr:
    needs: verify
    if: github.event_name != 'workflow_dispatch' || inputs.registry != 'npm'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x
      # tokens.ts is committed + drift-gated above; build it anyway so JSR always
      # publishes bytes that match a fresh Style-Dictionary run.
      - run: npm ci
      - run: npm run build:ts
      - name: Publish to JSR (keyless OIDC)
        # `npx jsr publish`, not `deno publish`. The package IS linked to this
        # repo on JSR and OIDC needs no secret, yet `deno publish` was refused
        # with `actorNotScopeMember` — i.e. it authenticated as an actor JSR does
        # not accept for the scope. The permission is not the gap: the npm job
        # above authenticates by OIDC from the same inherited `id-token: write`
        # and succeeds. `npx jsr publish` is the path JSR's own "publish from CI"
        # docs give, so use it rather than keep guessing at deno's auth.
        #
        # The jsr CLI runs the same slow-type check deno publish did, so nothing
        # is given up. setup-deno above is now only needed if this is reverted —
        # drop it once a green JSR publish confirms this path.
        run: npx jsr publish
