name: deploy-tokens

# Deploy the spec-conformant token bundle (DTCG tokens.json + format projections
# + manifest.json contract) to GitHub Pages. One source (tokens.json) projects to
# many surfaces, deployed at a stable URL consumers can fetch and verify by hash.
#
# Requires Pages enabled: Settings → Pages → Source = GitHub Actions.
# Cut a release tag to publish (matches publish.yml); workflow_dispatch for ad-hoc.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-tokens
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci

      # Regenerate the curated web CSS + the native/Figma projections, then
      # assemble the bundle. --check first so a non-conformant source fails loud.
      - run: npm run build:css
      - run: npm run build:sd
      - run: node tools/build-tokens-dist.mjs --check
      - run: node tools/build-tokens-dist.mjs # GITHUB_SHA is in env → manifest.commit

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/tokens-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
